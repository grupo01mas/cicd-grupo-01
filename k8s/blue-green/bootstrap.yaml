# ABOUTME: Blue/Green bootstrap for the todolist app: two colored Deployments, one
# ABOUTME: ClusterIP Service each, a production Service (selector flipped by the switch
# ABOUTME: pipeline) and Ingresses routing production + per-color hosts via nginx.
---
apiVersion: v1
kind: Namespace
metadata:
  name: todolist-bg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-blue
  namespace: todolist-bg
  labels:
    app: todolist
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todolist
      color: blue
  template:
    metadata:
      labels:
        app: todolist
        color: blue
    spec:
      containers:
        - name: todolist
          # Troque SEU_USUARIO_DOCKERHUB pelo seu usuário do Docker Hub antes do
          # primeiro deploy: o bootstrap sobe as duas cores com esta imagem.
          image: SEU_USUARIO_DOCKERHUB/app-k8s-todolist:latest
          ports:
            - containerPort: 5000
          env:
            - name: APP_PORT
              value: "5000"
            - name: APP_COLOR
              value: blue
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-green
  namespace: todolist-bg
  labels:
    app: todolist
    color: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todolist
      color: green
  template:
    metadata:
      labels:
        app: todolist
        color: green
    spec:
      containers:
        - name: todolist
          # Troque SEU_USUARIO_DOCKERHUB pelo seu usuário do Docker Hub antes do
          # primeiro deploy: o bootstrap sobe as duas cores com esta imagem.
          image: SEU_USUARIO_DOCKERHUB/app-k8s-todolist:latest
          ports:
            - containerPort: 5000
          env:
            - name: APP_PORT
              value: "5000"
            - name: APP_COLOR
              value: green
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
# Fixed per-color Service (direct access for testing the blue slot).
apiVersion: v1
kind: Service
metadata:
  name: todolist-blue
  namespace: todolist-bg
  labels:
    app: todolist
    color: blue
spec:
  type: ClusterIP
  selector:
    app: todolist
    color: blue
  ports:
    - port: 80
      targetPort: 5000
---
# Fixed per-color Service (direct access for testing the green slot).
apiVersion: v1
kind: Service
metadata:
  name: todolist-green
  namespace: todolist-bg
  labels:
    app: todolist
    color: green
spec:
  type: ClusterIP
  selector:
    app: todolist
    color: green
  ports:
    - port: 80
      targetPort: 5000
---
# Production Service: the switch pipeline flips its selector color.
apiVersion: v1
kind: Service
metadata:
  name: todolist
  namespace: todolist-bg
  labels:
    app: todolist
spec:
  type: ClusterIP
  selector:
    app: todolist
    color: blue
  ports:
    - port: 80
      targetPort: 5000
---
# One Ingress, three hosts: production (switched via the Service selector) and one
# stable host per color for direct testing before the switch.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todolist-bg
  namespace: todolist-bg
spec:
  ingressClassName: nginx
  rules:
    - host: todolist-bg.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist
                port:
                  number: 80
    - host: blue.todolist-bg.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist-blue
                port:
                  number: 80
    - host: green.todolist-bg.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist-green
                port:
                  number: 80
