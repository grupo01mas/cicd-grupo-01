# ABOUTME: Esqueleto do pipeline de CI: quality gates que bloqueiam o merge em PR.
# ABOUTME: Renomeie para ci.yml e complete os TODOs; arquivos .example não são lidos pelo GitHub.
#
# ┌─ COMO USAR ────────────────────────────────────────────────────────────────┐
# │ 1. git mv .github/workflows/ci.yml.example .github/workflows/ci.yml       │
# │ 2. Complete os TODOs, de cima para baixo                                  │
# │ 3. Commit numa branch, abra PR, veja o workflow rodar na aba Actions      │
# └────────────────────────────────────────────────────────────────────────────┘
#
# Referência: docs/ci-pipeline.md

name: CI

# TODO: o pipeline precisa rodar em toda proposta de merge e em tudo que entra
# na main. Dois gatilhos:
#   - pull_request com branches: [main]
#   - push com branches: [main]
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Menor privilégio: o GITHUB_TOKEN deste workflow só consegue LER o repositório.
# Sem este bloco, o token vem com contents: write por padrão.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    uses: ./.github/workflows/_reusable-test.yml
    with:
      python-version: ${{ matrix.python-version }}

  # TODO: job deploy-staging que reivindica o environment staging (required
  # reviewer pausa o job até alguém aprovar). Só roda em push na main, não em PR:
