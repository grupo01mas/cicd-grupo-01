    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO: instale o Python com actions/setup-python@v5. Comece fixando
      # '3.11'; ao introduzir a matrix isso vira ${{ matrix.python-version }}.

      # TODO: adicione o cache de pip com actions/cache@v4.
