# ABOUTME: Pipeline de CI com quality gates que bloqueiam o merge em PR.
# Referência: docs/ci-pipeline.md

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Menor privilégio: o GITHUB_TOKEN deste workflow só consegue LER o repositório.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    # Necessário para o upload do SARIF do Trivy (via reusable) funcionar.
    # O reusable herda as permissões do caller — precisa declarar aqui.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_reusable-test.yml
    with:
      python-version: ${{ matrix.python-version }}

  deploy-staging:
    name: Deploy to staging (dummy)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Simulate deploy
        run: |
          echo "Simulando deploy para staging."
          echo "Aprovação registrada no histórico de deployments do GitHub."

  notify:
    name: Notify
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send webhook
        env:
          WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          STATUS: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "NOTIFY_WEBHOOK_URL não configurado — pulando notificação."
            exit 0
          fi
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"CI: ${STATUS} — ${RUN_URL}\"}" \
            "$WEBHOOK"

  push:
    name: Build and push image
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "tags=${DH_USER}/app-k8s-todolist:latest,${DH_USER}/app-k8s-todolist:${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}