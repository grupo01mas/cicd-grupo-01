# ABOUTME: Esqueleto do reusable workflow que concentra os steps de teste do CI.
# ABOUTME: Renomeie para _reusable-test.yml e complete os TODOs.
#
# Por que o prefixo _ : convenção que sinaliza workflow de apoio, chamado por
# outros via `uses:` e nunca disparado por evento próprio.
#
# Referência: docs/ci-pipeline.md

name: Reusable — Test

# workflow_call é o que torna este arquivo chamável por outro workflow.
on:
  workflow_call:
    inputs:
      python-version:
        description: 'Versão do Python para rodar os testes'
        type: string
        required: true

jobs:
  test:
    name: Test (Python ${{ inputs.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-${{ inputs.python-version }}-${{ hashFiles('requirements*.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Test (pytest)
        run: pytest -v .

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt