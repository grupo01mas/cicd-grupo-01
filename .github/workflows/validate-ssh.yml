# ABOUTME: Valida que o GitHub Actions alcança a EC2 via SSH e fala com o cluster
# ABOUTME: kind, selecionando o contexto e listando os namespaces.

name: Validate SSH to EC2

# Disparo manual apenas: a validação é feita sob demanda, quando a EC2 está de pé
# e os secrets estão cadastrados. Rodar automaticamente só produziria falha nos
# momentos em que o cluster está parado.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: SSH into EC2 and reach kind
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Select kind context and list namespaces
        env:
          KIND_CLUSTER: ${{ vars.KIND_CLUSTER || 'devops-labs' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=accept-new \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
              "kubectl config use-context kind-${KIND_CLUSTER} && kubectl get namespaces"
